  <div class="w sec"><div class="row"><h2>${t("pop_cats")}</h2><button class="link" data-act="allcat">${t("all_cats")}</button></div>
  <div class="cats">${CATS.map(c=>`<button class="cat" data-cat="${c}">${catL(c)}</button>`).join("")}</div></div>
  <div class="w sec" style="padding-top:0"><div class="row"><h2>${t("cities")}</h2></div><div class="cats">${CITIES.map(c=>`<button class="cat" data-city="${c}">${cityL(c)}</button>`).join("")}</div></div>
  <div class="w sec" style="padding-top:0"><div class="row"><h2>${t("pop_cr")}</h2><button class="link" data-go="/catalog">${t("see_all")}</button></div>
  <div class="grid">${CR.length?CR.slice(0,4).map(card).join(""):`<div class="empty">${t("no_cr_first")}<br><button class="btn o sm" style="margin-top:12px" data-go="/auth?m=reg&role=creator">${t("create_profile")}</button></div>`}</div></div>
  <div class="w sec" style="padding-top:0"><div class="row"><h2>${t("why")}</h2></div><div class="why">
  ${[1,2,3,4].map(i=>`<div><b>${t("w"+i+"t")}</b><p>${t("w"+i+"d")}</p></div>`).join("")}</div></div>
  <div class="w sec" style="padding-top:0"><div class="cta"><h2>${t("cta_cr")}</h2><button class="btn" data-go="/auth?m=reg&role=creator">${t("create_profile")}</button></div></div>`;
  $("#hgo").onclick=()=>{F={...F,q:$("#hq").value,city:$("#hc").value,cat:$("#hk").value,price:$("#hp").value,type:$("#ht").value,fav:false};go("/catalog")};
}

</script>
<script>
/* Каталог креаторов (фильтры) */
function catalog(){
  $("#app").innerHTML=`<div class="w"><div class="cat-l"><aside class="side"><h2 style="font-size:17px">${t("filters")}</h2>
  <label>${t("search")}<input type="text" id="fq" value="${F.q}" placeholder="${t("name_topic")}"></label>
  <label>${t("city")}<select id="fc1"><option value="">${t("all")}</option>${opt(CITIES,F.city,cityL)}</select></label>
  <label>${t("category")}<select id="fk"><option value="">${t("all")}</option>${opt(CATS,F.cat,catL)}</select></label>
  <label>${t("price")}<select id="fp"><option value="">${t("any")}</option>${[12000,15000,20000].map(p=>`<option value="${p}" ${F.price==p?"selected":""}>${t("upto",{p:money(p)})}</option>`).join("")}</select></label>
  <label>${t("ctype")}<select id="ft"><option value="">${t("all")}</option>${opt(["Видео","Фото"],F.type,typeL)}</select></label>
  <label>${t("sort")}<select id="fs"><option value="r">${t("by_rating")}</option><option value="p" ${F.sort=="p"?"selected":""}>${t("cheaper")}</option></select></label>
  <label class="ck"><input type="checkbox" id="ff" ${F.fav?"checked":""}> ${t("only_fav")}</label>
  <button class="btn g sm" id="fr">${t("reset")}</button></aside>
  <div><div class="row"><h2>${t("creators_h")}</h2><span id="cnt" style="color:var(--mut);font-size:14px"></span></div><div class="grid" id="lst"></div></div></div></div>`;
  const rd=()=>{
    F={q:$("#fq").value,city:$("#fc1").value,cat:$("#fk").value,price:$("#fp").value,type:$("#ft").value,sort:$("#fs").value,fav:$("#ff").checked};
    const l=CR.filter(x=>(!F.q||(x.n+" "+x.city+" "+cityL(x.city)+" "+x.t.join(" ")+" "+x.t.map(catL).join(" ")).toLowerCase().includes(F.q.toLowerCase()))&&(!F.city||x.city===F.city)&&(!F.cat||x.t.includes(F.cat))&&(!F.price||x.p<=+F.price)&&(!F.type||x.type===F.type)&&(!F.fav||favs.includes(x.id))).sort((a,b)=>F.sort=="p"?a.p-b.p:b.r-a.r);
    $("#cnt").textContent=t("found",{n:l.length});
    $("#lst").innerHTML=l.length?l.map(card).join(""):`<div class="empty">${CR.length?t("nobody"):t("none_yet")}<br>${CR.length?`<button class="btn o sm" style="margin-top:12px" id="fr2">${t("reset_f")}</button>`:""}</div>`;
    const r2=$("#fr2");if(r2)r2.onclick=rs;
  };
  const rs=()=>{F={q:"",city:"",cat:"",price:"",type:"",sort:"r",fav:false};catalog()};
  document.querySelectorAll(".side select,.side input").forEach(e=>e.oninput=rd);
  $("#fr").onclick=rs;rd();
}

</script>
<script>
/* Профиль креатора, видео, окно «Связаться» */
function creator(id){
  const x=CR.find(c=>c.id==id);if(!x)return go("/catalog");const own=x.own&&user&&user.email===x.email;
  const delBtn=v=>own?`<button class="link" data-act="delvid" data-id="${x.id}" data-v="${v.id}" aria-label="${t("del_video")}">✕</button>`:"";
  $("#app").innerHTML=`<div class="w"><div class="pf"><div>
  <button class="link" data-go="/catalog" style="margin-bottom:14px">${t("back")}</button>
  <div class="box"><div class="hd"><div class="av" style="background:${bg(x)}">${x.n[0]}</div><div><h1>${x.n}</h1>
  <div style="color:var(--mut)">${x.c?t("reviews_n",{r:x.r,c:x.c})+" · ":t("new_cr")+" · "}${cityL(x.city)}</div></div></div>
  <p style="margin:16px 0 10px">${x.bio||t("def_bio")}</p><div class="chips">${x.t.map(c=>`<span>${catL(c)}</span>`).join("")}</div></div>
  <div class="box"><div class="row"><h2>${t("portfolio")}</h2>${own?`<button class="btn sm" data-act="addvid" data-id="${x.id}">${t("add_video")}</button>`:""}</div>${(x.vids||[]).length?`<div class="port">${x.vids.map(v=>v.u?`<a class="vt" href="${esc(v.u)}" target="_blank" rel="noopener noreferrer"><b style="margin:auto;font-size:30px">▶</b><span>${esc(v.t)}${delBtn(v)}</span></a>`:`<div class="vt"><video controls playsinline preload="metadata" data-vid="${v.id}"></video><span>${esc(v.t)}${delBtn(v)}</span></div>`).join("")}</div>`:`<p style="color:var(--mut)">${t("no_videos")}</p>`}</div>
  <div class="box"><h2 style="margin-bottom:8px">${t("reviews")}</h2>
  <p style="color:var(--mut)">${t("no_reviews")}</p></div></div>
  <aside class="box" style="position:sticky;top:84px"><h2 style="margin-bottom:10px">${t("cost")}</h2>
  <div class="pk"><span>${t("video_ugc")}</span><b>${money(x.p)}</b></div><div class="pk"><span>${t("photo_set")}</span><b>${money(x.ph)}</b></div>
  <div style="display:grid;gap:10px;margin-top:18px"><button class="btn" data-contact="${x.id}">${t("contact")}</button>
  ${own?`<button class="btn g" data-act="delcr" data-id="${x.id}">${t("del_profile")}</button>`:""}<button class="btn o" data-fav="${x.id}">${favs.includes(x.id)?t("in_fav"):t("add_fav")}</button></div></aside></div></div>`;
  document.querySelectorAll("video[data-vid]").forEach(async el=>{try{const b=await vget(+el.dataset.vid);if(b)el.src=URL.createObjectURL(b);else el.replaceWith(t("video_unavail"))}catch{el.replaceWith(t("video_unavail"))}});
}
function addVid(id){
  const x=CR.find(c=>c.id==id);if(!x)return;
  modal(`<h2>${t("add_video")}</h2><label style="font-size:13px;color:var(--mut)">${t("title_l")}<input class="i" id="vt" maxlength="60" placeholder="${t("title_ph")}"></label>
  <label style="font-size:13px;color:var(--mut)">${t("file_l")}<input class="i" id="vf" type="file" accept="video/*"></label>
  <label style="font-size:13px;color:var(--mut)">${t("or_link")}<input class="i" id="vu" type="url" placeholder="https://..."></label>
  <div class="err" id="ve"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn g" data-act="close">${t("cancel")}</button><button class="btn" id="vs">${t("add")}</button></div>`);
  $("#vs").onclick=async()=>{
    const f=$("#vf").files[0],u=$("#vu").value.trim(),tt=$("#vt").value.trim()||t("def_vtitle"),e=$("#ve");
    if(!f&&!u)return e.textContent=t("e_pick");
    if(!f&&!/^https?:\/\/\S+$/.test(u))return e.textContent=t("e_link");
    if(f&&f.size>100*1048576)return e.textContent=t("e_big");
    const v={id:Date.now(),t:tt};
    try{if(f){await vput(v.id,f);v.f=1}else v.u=u}catch{return e.textContent=t("e_save")}
    x.vids=[...(x.vids||[]),v];sv("ugc_cr",CR.filter(c=>c.own));close();creator(x.id);toast(t("video_added"));
  };
}
function contact(id){
  if(!user){toast(t("login_first"));return go("/auth?m=in")}
  const x=CR.find(c=>c.id==id);
  modal(`<h2>${t("write_to",{n:x.n})}</h2><label style="font-size:13px;color:var(--mut)">${t("describe")}<textarea class="i" id="msg" rows="4" placeholder="${t("desc_ph")}"></textarea></label>
  <div class="err" id="me"></div><div style="display:flex;gap:10px;justify-content:flex-end"><button class="btn g" data-act="close">${t("cancel")}</button><button class="btn" id="send">${t("send")}</button></div>`);
  $("#send").onclick=()=>{if($("#msg").value.trim().length<5)return $("#me").textContent=t("e_desc");close();toast(t("sent",{n:x.n}))};
}

</script>
<script>
/* Вход и регистрация */
function auth(p){
  let m=p.get("m")||"in",role=p.get("role")||"biz";
  const draw=()=>{
    $("#app").innerHTML=`<div class="w"><div class="fm box"><div class="tabs"><button data-m="in" class="${m=="in"?"on":""}">${t("tab_in")}</button><button data-m="reg" class="${m=="reg"?"on":""}">${t("tab_reg")}</button></div>
    <form id="af" novalidate>${m=="reg"?`<div class="tabs"><button type="button" data-r="biz" class="${role=="biz"?"on":""}">${t("i_biz")}</button><button type="button" data-r="creator" class="${role=="creator"?"on":""}">${t("i_cr")}</button></div>
    <label>${t("name")}<input class="i" id="an" placeholder="${role=="biz"?t("brand_name"):t("your_name")}"></label>${role=="creator"?`<label>${t("city")}<select class="i" id="ac">${opt(CITIES,"",cityL)}</select></label><label>${t("category")}<select class="i" id="ak">${opt(CATS,"",catL)}</select></label><label>${t("ctype")}<select class="i" id="at">${opt(["Видео","Фото"],"",typeL)}</select></label><label>${t("price_video")}<input class="i" id="apr" type="number" min="1000" placeholder="10000"></label>`:""}`:""}
    <label>${t("email")}<input class="i" id="ae" type="email" placeholder="you@mail.kz"></label>
    <label>${t("password")}<input class="i" id="ap" type="password" placeholder="${t("pass_ph")}"></label>
    <div class="err" id="ar"></div><button class="btn" type="submit">${m=="in"?t("login"):t("create_acc")}</button></form></div></div>`;
    document.querySelectorAll("[data-m]").forEach(b=>b.onclick=()=>{m=b.dataset.m;draw()});
    document.querySelectorAll("[data-r]").forEach(b=>b.onclick=()=>{role=b.dataset.r;draw()});
    $("#af").onsubmit=e=>{e.preventDefault();const em=$("#ae").value.trim(),pw=$("#ap").value,nm=m=="reg"?$("#an").value.trim():"";
      const er=(!/^\S+@\S+\.\S+$/.test(em))?t("e_email"):pw.length<6?t("e_pass"):(m=="reg"&&!nm)?t("e_name"):(m=="reg"&&role=="creator"&&!(+$("#apr").value>=1000))?t("e_price"):"";
      if(er)return $("#ar").textContent=er;
      user={name:nm||em.split("@")[0],email:em,role};sv("ugc_u",user);head();toast(m=="in"?t("logged_in"):t("acc_created"));
      if(m=="reg"&&role=="creator"){const pr=+$("#apr").value,id=Date.now();CR.push({id,n:nm,r:0,c:0,city:$("#ac").value,v:"—",t:[$("#ak").value],p:pr,ph:Math.round(pr/2),type:$("#at").value,h:Math.floor(Math.random()*330),bio:"",own:1,email:em});sv("ugc_cr",CR.filter(x=>x.own));return go("/creator/"+id)}
      go("/");};
  };draw();
}

</script>
<script>
/* Страница «Бренды» */
function brands(){
  const S=[1,2,3,4].map(i=>[t("s"+i+"t"),t("s"+i+"d")]);
  $("#app").innerHTML=`<div class="ph2"><div class="w"><h1>${t("brands_t")}</h1><p>${t("brands_lead")}</p></div></div>
  <div class="w sec"><div class="row"><h2>${t("get_h")}</h2></div><div class="why">
  ${[1,2,3,4].map(i=>`<div><b>${t("g"+i+"t")}</b><p>${t("g"+i+"d")}</p></div>`).join("")}</div></div>
  <div class="w sec" style="padding-top:0"><div class="row"><h2>${t("how_h")}</h2></div><div class="ins">${S.map(([a,b],i)=>`<div><b>${i+1}</b>${a}<p style="color:var(--mut);font-size:13px;margin-top:4px">${b}</p></div>`).join("")}</div></div>
  <div class="w sec" style="padding-top:0"><div class="cta"><h2>${t("cta_b")}</h2><div style="display:flex;gap:10px;flex-wrap:wrap"><button class="btn" data-go="/catalog">${t("open_cat")}</button><button class="btn" data-go="/auth?m=reg&role=biz">${t("reg_brand")}</button></div></div></div>`;
}

</script>
<script>
/* Страница «О нас» */
function about(){
  $("#app").innerHTML=`<div class="ph2"><div class="w"><h1>${t("about_t")}</h1><p>${t("about_lead")}</p></div></div>
  <div class="w sec"><div class="ins"><div><b>18</b>${t("st1")}</div><div><b>0 ₸</b>${t("st2")}</div><div><b>Real people</b>Real content. Real results.</div></div></div>
  <div class="w sec" style="padding-top:0"><div class="box"><h2 style="margin-bottom:8px">${t("idea_h")}</h2><p style="color:var(--mut)">${t("idea")}</p></div>
  <div class="box"><h2 style="margin-bottom:12px">${t("cities")}</h2><div class="chips" style="gap:8px">${CITIES.map(c=>`<button class="cat" style="padding:7px 14px" data-city="${c}">${cityL(c)}</button>`).join("")}</div></div>
  <div class="box"><h2 style="margin-bottom:8px">${t("contacts")}</h2><div class="pk"><span>${t("site")}</span><b>www.ugc.kz</b></div><div class="pk"><span>${t("mail")}</span><a class="link" href="mailto:hello@ugc.kz">hello@ugc.kz</a></div><div class="pk"><span>Instagram</span><b>@ugc.kz</b></div></div></div>`;
}

</script>
<script>
/* Роутер и обработчики кликов (подключается последним) */
function route(){
  const [path,qs]=(location.hash.slice(1)||"/").split("?"),p=new URLSearchParams(qs||""),s=path.split("/").filter(Boolean);
  applyStatic();head();scrollTo(0,0);
  document.querySelectorAll("nav a").forEach(a=>{const g=a.dataset.go.split("?")[0];a.classList.toggle("on",g=="/"+(s[0]=="creator"?"catalog":s[0]||""))});
  if(!s.length)home();else if(s[0]=="catalog")catalog();else if(s[0]=="creator")creator(s[1]);else if(s[0]=="auth")auth(p);else if(s[0]=="brands")brands();else if(s[0]=="about")about();else go("/");
}
function toggleFav(id){favs=favs.includes(id)?favs.filter(f=>f!==id):[...favs,id];sv("ugc_f",favs);head()}
document.addEventListener("click",e=>{
  const t=e.target,f=t.closest("[data-fav]");
  if(f){e.stopPropagation();toggleFav(+f.dataset.fav);const y=scrollY;route();scrollTo(0,y);return}
  const c=t.closest("[data-contact]");if(c)return contact(c.dataset.contact);
  const k=t.closest("[data-cat]");if(k){F={...F,cat:k.dataset.cat,q:"",city:"",price:"",type:"",fav:false};return go("/catalog")}
  const ci=t.closest("[data-city]");if(ci){F={q:"",city:ci.dataset.city,cat:"",price:"",type:"",sort:"r",fav:false};return go("/catalog")}
  const a=t.closest("[data-act]");
  if(a){e.preventDefault();const v=a.dataset.act;
    if(v=="addvid")addVid(a.dataset.id);
    if(v=="delvid"){const x=CR.find(c=>c.id==a.dataset.id);if(x){const vi=(x.vids||[]).find(q=>q.id==a.dataset.v);x.vids=(x.vids||[]).filter(q=>q.id!=a.dataset.v);if(vi&&vi.f)vdel(vi.id).catch(()=>{});sv("ugc_cr",CR.filter(c=>c.own));creator(x.id);toast(t("video_deleted"))}}
    if(v=="out"){user=null;sv("ugc_u",null);toast(t("logged_out"));go("/");head()}
    if(v=="close")close();
    if(v=="delcr"){const i=CR.findIndex(c=>c.id==a.dataset.id);if(i>-1){(CR[i].vids||[]).forEach(q=>q.f&&vdel(q.id).catch(()=>{}));CR.splice(i,1)}sv("ugc_cr",CR.filter(c=>c.own));toast(t("profile_deleted"));go("/catalog")}
    if(v=="allcat"){F={...F,cat:""};go("/catalog")}
    return}
  const g=t.closest("[data-go]");if(g)go(g.dataset.go);
  if(t.id=="modal")close();
});
$("#favb").onclick=()=>{F={q:"",city:"",cat:"",price:"",type:"",sort:"r",fav:true};location.hash=="#/catalog"?catalog():go("/catalog")};
$("#lang").onchange=e=>{setLang(e.target.value);close();route()};
addEventListener("hashchange",route);route();

</script>
